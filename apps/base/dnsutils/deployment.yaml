apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnsutils
  namespace: dnsutils
spec:
  selector:
    matchLabels:
      app: dnsutils
  template:
    metadata:
      labels:
        app: dnsutils
    spec:
      containers:
        - name: dnsutils
          image: ghcr.io/avnes/dnsutils:v0.0.3
          command:
            - sleep
            - "infinity"
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "128Mi"
              cpu: 5m
            limits:
              memory: "128Mi"
