apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headlamp
  namespace: flux-system
spec:
  dependsOn:
    - name: flux-system
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/stable/headlamp
  prune: true
  postBuild:
    substitute:
      fluxcd_cluster_name: "angerboda"
