apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: falco
  namespace: flux-system
spec:
  dependsOn:
    - name: flux-system
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/stable/falco
  prune: true
  postBuild:
    substitute:
      fluxcd_traefik_dashboard_host: "traefik.angerboda.anyops.dev"
      fluxcd_falco_ingress_host: "falco.angerboda.anyops.dev"
