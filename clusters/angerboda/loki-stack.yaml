apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loki-stack
  namespace: flux-system
spec:
  dependsOn:
    - name: flux-system
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/stable/loki-stack
  prune: true
  postBuild:
    substitute:
      fluxcd_loki_stack_grafana_ingress_host: "grafana.angerboda.anyops.site"
      fluxcd_traefik_dashboard_host: "traefik.angerboda.anyops.site"
