apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-config
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets
    - name: longhorn
    - name: metallb
    - name: traefik
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/angerboda/config
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      fluxcd_pocketid_ingress_host: id.angerboda.anyops.dev
    substituteFrom:
      - kind: Secret
        name: traefik-oidc-auth
      - kind: Secret
        name: longhorn-oidc-auth
