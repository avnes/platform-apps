apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns
  namespace: flux-system
spec:
  dependsOn:
    - name: cluster-config
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: catalogue
  path: ./infrastructure/external-dns
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  patches:
    - patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: external-dns
          namespace: external-dns
        spec:
          values:
            txtOwnerId: angerboda-anyops
            domainFilters:
            - anyops.site
            - anyops.dev
            provider:
              webhook:
                env:
                - name: DO_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: external-dns
                      key: digitalocean_api_token
                - name: DO_DOMAIN_FILTER
                  value: anyops.site,anyops.dev
      target:
        kind: HelmRelease
        name: external-dns
        namespace: external-dns
