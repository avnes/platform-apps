apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-dashboard-auth
  namespace: traefik
spec:
  basicAuth:
    secret: traefik-dashboard-auth
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
    name: traefik-oidc-auth
    namespace: traefik
spec:
    plugin:
        traefik-oidc-auth:
            Provider:
                ClientId: ${fluxcd_pocketid_client_id_for_traefik}
                ClientSecret: ${fluxcd_pocketid_client_secret_for_traefik}
                Url: https://${fluxcd_pocketid_ingress_host}/
            Scopes:
                - openid
                - profile
                - email
