apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
    name: traefik-oidc-auth
    namespace: traefik
spec:
    plugin:
        traefik-oidc-auth:
            Provider:
                ClientId: ${fluxcd_pocketid_client_id_for_traefik}
                ClientSecret: ${fluxcd_pocketid_client_secret_for_traefik}
                Url: https://${fluxcd_pocketid_ingress_host}/
            Scopes:
                - openid
                - profile
                - email
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashboard-root-redirect
  namespace: traefik
spec:
  redirectRegex:
    regex: "^https?://${fluxcd_traefik_dashboard_host}/?$"
    replacement: "https://${fluxcd_traefik_dashboard_host}/dashboard/"
    permanent: true
