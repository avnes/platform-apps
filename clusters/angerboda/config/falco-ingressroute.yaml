apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
    name: falco-oidc-auth
    namespace: falco
spec:
    plugin:
        traefik-oidc-auth:
            Provider:
                ClientId: ${fluxcd_pocketid_client_id_for_falco}
                ClientSecret: ${fluxcd_pocketid_client_secret_for_falco}
                Url: https://${fluxcd_pocketid_ingress_host}/
            Scopes:
                - openid
                - profile
                - email
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: falco
  namespace: falco
  annotations:
    external-dns.kubernetes.io/target: traefik.angerboda.anyops.dev
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`falco.angerboda.anyops.dev`)
      kind: Rule
      middlewares:
        - name: falco-oidc-auth
      services:
        - name: longhorn-frontend
          port: 80
  tls:
    certResolver: letsencrypt-dns
