apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: freya
  namespace: cnpg-system
spec:
  instances: 3

  bootstrap:
    initdb:
      database: app
      owner: ${fluxcd_cnpg_postgresql_owner}
      secret:
        name: postgresql-credentials
      dataChecksums: true

  storage:
    size: 1Gi
