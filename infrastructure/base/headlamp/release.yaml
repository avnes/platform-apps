apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: kube-system
spec:
  chart:
    spec:
      chart: headlamp
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
  interval: 1m0s
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    config:
      inClusterContextName: ${fluxcd_cluster_name}
      baseURL: ""
      unsafeUseServiceAccountToken: true
      pluginsDir: /build/plugins
    initContainers:
      - name: kubescape-plugin
        image: quay.io/kubescape/headlamp-plugin:v0.11.2
        command:
          - /bin/sh
          - -c
          - mkdir -p /build/plugins && cp -r /plugins/* /build/plugins/ && chown -R 100:101 /build
        securityContext:
          runAsNonRoot: false
          privileged: false
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
          - name: headlamp-plugins
            mountPath: /build/plugins
      - name: cert-manager-plugin
        image: alpine:3.22.0
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            archive=/tmp/headlamp-cert-manager.tar.gz
            mkdir -p /build/plugins
            wget -qO "$archive" https://github.com/headlamp-k8s/plugins/releases/download/cert-manager-0.1.1/headlamp-k8s-cert-manager-0.1.1.tar.gz
            printf '%s  %s\n' 2b06caae0a207e2c30ce0d21bc4d672ae0a71a2cffc23a4585199110533032ab "$archive" | sha256sum -c -
            tar -xzf "$archive" -C /build/plugins
            chown -R 100:101 /build
        securityContext:
          runAsNonRoot: false
          privileged: false
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
          - name: headlamp-plugins
            mountPath: /build/plugins
      - name: flux-plugin
        image: ghcr.io/headlamp-k8s/headlamp-plugin-flux:v0.7.0
        command:
          - /bin/sh
          - -c
          - mkdir -p /build/plugins && cp -r /plugins/* /build/plugins/ && chown -R 100:101 /build
        securityContext:
          runAsNonRoot: false
          privileged: false
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
          - name: headlamp-plugins
            mountPath: /build/plugins
    volumeMounts:
      - name: headlamp-plugins
        mountPath: /build/plugins
    volumes:
      - name: headlamp-plugins
        emptyDir: {}
