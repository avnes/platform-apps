apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocketid-encryption
  namespace: pocketid
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: oracle-vault
  target:
    name: pocketid-encryption
    creationPolicy: Owner
  data:
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: pocketid_encryption
