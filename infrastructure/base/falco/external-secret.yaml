apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falco-oidc-auth
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oracle-vault
  target:
    name: falco-oidc-auth
    creationPolicy: Owner
  data:
    - secretKey: fluxcd_pocketid_client_id_for_falco
      remoteRef:
        key: fluxcd_pocketid_client_id_for_falco
    - secretKey: fluxcd_pocketid_client_secret_for_falco
      remoteRef:
        key: fluxcd_pocketid_client_secret_for_falco
