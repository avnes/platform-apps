apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
  namespace: falco
spec:
  dependsOn:
    - name: prometheus-operator-crds
      namespace: flux-system
    - name: traefik
      namespace: traefik
  chart:
    spec:
      chart: falco
      sourceRef:
        kind: HelmRepository
        name: falcosecurity
  interval: 1m0s
  timeout: 10m0s
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    tty: true
    falcosidekick:
      enabled: true
      webui:
        enabled: true
        replicaCount: 1
        disableauth: true
        ingress:
          enabled: true
          annotations:
            external-dns.kubernetes.io/target: ${fluxcd_traefik_dashboard_host}
          hosts:
            - host: ${fluxcd_falco_ingress_host}
              paths:
                - path: /
                  pathType: Prefix
