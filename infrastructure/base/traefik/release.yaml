apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  dependsOn:
    - name: prometheus-operator-crds
      namespace: flux-system
    - name: external-dns
      namespace: external-dns
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
  interval: 1m0s
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    deployment:
      enabled: true
      kind: Deployment
      replicas: 2
    certificatesResolvers:
      letsencrypt-dns:
        acme:
          email: audun.nes@gmail.com
          storage: /certificates/acme.json
          caServer: https://acme-v02.api.letsencrypt.org/directory
          dnsChallenge:
            provider: digitalocean
            delayBeforeCheck: 30s
            resolvers:
              - "1.1.1.1:53"
              - "8.8.8.8:53"
    env:
    - name: DO_AUTH_TOKEN
      valueFrom:
        secretKeyRef:
          name: external-dns
          key: digitalocean_api_token
    volumes:
      - name: traefik-certificates
        persistentVolumeClaim:
          claimName: traefik-certificates
    additionalVolumeMounts:
      - name: traefik-certificates
        mountPath: /certificates
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: "Host(`${fluxcd_traefik_dashboard_host}`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))"
        entryPoints: ["traefik", "web", "websecure"]
        middlewares:
          - name: traefik-dashboard-auth
            namespace: traefik
        tls:
          certResolver: letsencrypt-dns
          domains:
            - main: angerboda.anyops.dev
              sans:
                - "*.angerboda.anyops.dev"
      healthcheck:
        enabled: true
        entryPoints: ["traefik", "web", "websecure"]
    service:
      enabled: true
      type: LoadBalancer
      annotations:
        external-dns.kubernetes.io/hostname: ${fluxcd_traefik_dashboard_host}
        metallb.universe.tf/address-pool: lb-pool
      labels:
        scrape-service-metrics: "true"
      spec:
        externalTrafficPolicy: Local
    ports:
      traefik:
        expose:
          default: true
        exposedPort: 32090
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
        observability:
          accessLogs: false
          metrics: false
          tracing: false
        forwardedHeaders:
          insecure: true
        expose:
          default: true
        nodePort: 32080
      websecure:
        expose:
          default: true
        nodePort: 32443
    metrics:
      prometheus:
        entryPoint: metrics
        service:
          enabled: true
          labels:
            scrape-service-metrics: "true"
