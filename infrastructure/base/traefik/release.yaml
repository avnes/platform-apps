apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  dependsOn:
    - name: prometheus-operator-crds
      namespace: flux-system
    - name: external-dns
      namespace: external-dns
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
  interval: 1m0s
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    deployment:
      enabled: true
      kind: DaemonSet
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: "Host(`${fluxcd_traefik_dashboard_host}`) && PathPrefix(`/api`, `/dashboard`)"
        entryPoints: ["traefik", "web"]
        middlewares:
          - name: traefik-dashboard-auth
            namespace: traefik
      healthcheck:
        enabled: true
        entryPoints: ["traefik", "web"]
    service:
      enabled: true
      type: LoadBalancer
      annotations:
        external-dns.kubernetes.io/hostname: ${fluxcd_traefik_dashboard_host}
        metallb.universe.tf/address-pool: lb-pool
      labels:
        scrape-service-metrics: "true"
      spec:
        externalTrafficPolicy: Local
    ports:
      traefik:
        expose:
          default: true
        exposedPort: 32090
      web:
        forwardedHeaders:
          insecure: true
        expose:
          default: true
        nodePort: 32080
      websecure:
        expose:
          default: true
        nodePort: 32443
    metrics:
      prometheus:
        entryPoint: metrics
        service:
          enabled: true
          labels:
            scrape-service-metrics: "true"
