# traefik-dns-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-config
  namespace: traefik
data:
  traefik.yaml: |
    entryPoints:
      web:
        address: ":80"
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
      websecure:
        address: ":443"

    certificatesResolvers:
      letsencrypt-dns:
        acme:
          email: admin@example.com
          storage: /data/acme.json
          caServer: https://acme-v02.api.letsencrypt.org/directory
          dnsChallenge:
            provider: digitalocean
            delayBeforeCheck: 30s
            resolvers:
              - "1.1.1.1:53"
              - "8.8.8.8:53"

    providers:
      kubernetesCRD: {}
