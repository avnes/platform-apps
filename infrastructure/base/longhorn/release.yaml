apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  dependsOn:
    - name: traefik
      namespace: traefik
    - name: prometheus-operator-crds
      namespace: flux-system
  chart:
    spec:
      chart: longhorn
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn-system
  interval: 1m0s
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    ingress:
      enabled: true
      host: longhorn.example.tld
      tls: false
    defaultSettings:
      deletingConfirmationFlag: true
    metrics:
      serviceMonitor:
        enabled: true
    preUpgradeChecker:
      jobEnabled: false
      upgradeVersionCheck: false
    longhornManager:
      serviceAnnotations:
        prometheus.io/scrape: "true"
