apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  dependsOn:
    - name: prometheus-operator-crds
      namespace: flux-system
  chart:
    spec:
      chart: longhorn
      sourceRef:
        kind: HelmRepository
        name: longhorn
  interval: 1m0s
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    ingress:
      enabled: false
      tls: false
    defaultSettings:
      deletingConfirmationFlag: true
      storageMinimalAvailablePercentage: 10
    persistence:
      defaultClassReplicaCount: 1
    metrics:
      serviceMonitor:
        enabled: true
    preUpgradeChecker:
      jobEnabled: false
      upgradeVersionCheck: false
    longhornManager:
      serviceAnnotations:
        prometheus.io/scrape: "true"
    service:
      annotations:
        external-dns.kubernetes.io/hostname: ${fluxcd_longhorn_ingress_host}
