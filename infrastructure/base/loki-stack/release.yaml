apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: loki-system
spec:
  dependsOn:
    - name: prometheus-operator-crds
      namespace: flux-system
    - name: longhorn
      namespace: longhorn-system
    - name: traefik
      namespace: traefik
  chart:
    spec:
      chart: loki-stack
      sourceRef:
        kind: HelmRepository
        name: grafana
  interval: 1m0s
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    grafana:
      enabled: true
      defaultDashboardsEnabled: true
      image:
        tag: "13.3.0"
      persistence:
        enabled: true
        storageClassName: longhorn
        accessModes:
          - ReadWriteOnce
        size: 512Mi
      ingress:
        enabled: true
        hosts:
          - ${fluxcd_loki_stack_grafana_ingress_host}
        tls: []
        annotations:
          external-dns.kubernetes.io/target: ${fluxcd_traefik_dashboard_host}
      grafana.ini:
        auth.anonymous:
          enabled: false
        metrics:
          enabled: true
        server:
          domain: ${fluxcd_loki_stack_grafana_ingress_host}
          root_url: https://${fluxcd_loki_stack_grafana_ingress_host}/
    prometheus:
      enabled: true
      isDefault: false
      alertmanager:
        enabled: false
      server:
        persistentVolume:
          enabled: true
          accessModes:
            - ReadWriteOnce
          size: 1Gi
      prometheusSpec:
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        serviceMonitorNamespaceSelector: {}
    loki:
      persistence:
        enabled: true
        accessModes:
          - ReadWriteOnce
        size: 1Gi
      service:
        labels:
          scrape-service-metrics: "true"
      serviceMonitor:
        enabled: true
        interval: 15s
