apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-credentials
  namespace: cnpg-system
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: oracle-vault
  target:
    name: postgresql-credentials
    creationPolicy: Owner
  data:
    - secretKey: PGUSER
      remoteRef:
        key: postgresql_username
    - secretKey: PGPASSWORD
      remoteRef:
        key: postgresql_password
