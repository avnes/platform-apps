apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-credentials
  namespace: cnpg-system
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: oracle-vault
  target:
    name: postgresql-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: postgresql_username
    - secretKey: password
      remoteRef:
        key: postgresql_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-owner
  namespace: flux-system
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: oracle-vault
  target:
    name: postgresql-owner
    creationPolicy: Owner
  data:
    - secretKey: fluxcd_cnpg_postgresql_owner
      remoteRef:
        key: postgresql_username
