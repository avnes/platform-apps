apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: cnpg-system
spec:
  dependsOn:
    - name: prometheus-operator-crds
      namespace: flux-system
    - name: external-secrets
      namespace: external-secrets
  chart:
    spec:
      chart: cloudnative-pg
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: cnpg-system
  interval: 1m0s
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    monitoring:
      podMonitorEnabled: true
      grafanaDashboard:
        create: true
