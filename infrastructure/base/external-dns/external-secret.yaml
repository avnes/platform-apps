apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: external-dns
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: oracle-vault
  target:
    name: external-dns
    creationPolicy: Owner
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: In
      values:
      - external-dns
      - traefik
  data:
    - secretKey: digitalocean_api_token
      remoteRef:
        key: digitalocean_api_token
