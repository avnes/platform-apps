apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: external-dns
spec:
  refreshTime: 1m
  namespaceSelectors:
    - matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - external-dns
            - traefik
  externalSecretSpec:
    refreshInterval: 1m
    secretStoreRef:
      kind: ClusterSecretStore
      name: oracle-vault
    target:
      name: external-dns
      creationPolicy: Owner
    data:
      - secretKey: digitalocean_api_token
        remoteRef:
          key: digitalocean_api_token
