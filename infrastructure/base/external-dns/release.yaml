apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  dependsOn:
    - name: prometheus-operator-crds
      namespace: flux-system
    - name: external-secrets
      namespace: external-secrets
  chart:
    spec:
      chart: external-dns
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: external-dns
  interval: 1m0s
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    commonLabels:
      scrape-service-metrics: "true"
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/path: "/metrics"
      prometheus.io/port: "7979"
    serviceMonitor:
      enabled: true
    txtOwnerId: ${fluxcd_external_dnstxt_owner_id}
    sources:
      - ingress
      - service
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/amoniacou/external-dns-digitalocean-webhook
          tag: latest
        env:
          - name: DO_TOKEN
            valueFrom:
              secretKeyRef:
                name: external-dns
                key: digitalocean_api_token
          - name: DO_DOMAIN_FILTER
            value: ${fluxcd_external_dns_domain_filter_list}
        args:
          - --port=8080
          - --host=localhost
          - --health-port=8888
          - --health-host=0.0.0.0
          - --log-level=info
        securityContext:
          runAsUser: 65532
          runAsGroup: 65532
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8888
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8888
          initialDelaySeconds: 5
          periodSeconds: 5
    logLevel: debug
    policy: sync
    registry: txt
    extraArgs:
      webhook-provider-url: http://localhost:8080
    domainFilters:
      - ${fluxcd_external_dns_domain_filters}
    resources:
      limits:
        memory: 64Mi
      requests:
        memory: 64Mi
        cpu: 10m
