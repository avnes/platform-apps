apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubescape
  namespace: kubescape
spec:
  chart:
    spec:
      chart: kubescape-operator
      sourceRef:
        kind: HelmRepository
        name: kubescape
  interval: 1m0s
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    clusterName: ${fluxcd_cluster_name}
